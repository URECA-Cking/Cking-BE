plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.cking'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation platform('software.amazon.awssdk:bom:2.55.7')
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'com.adobe.testing:s3mock-testcontainers:5.2.3'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		// 부하 테스트(NFR-06)는 수백 건 동시 요청 + Consumer Drain 대기가 있어 매 빌드마다
		// 돌리지 않는다. 별도로 필요할 때 ./gradlew loadTest로 실행한다.
		excludeTags 'load', 'drawing-memory'
	}
	// 테스트 프로필 설정을 모든 테스트 컨텍스트에 추가해 Hikari 연결 수를 제한한다.
	systemProperty 'spring.config.additional-location', 'optional:classpath:/application-test.yml'
	// 다양한 WebMvcTest 컨텍스트가 CI JVM 힙을 모두 점유하지 않도록 캐시 개수를 제한한다.
	systemProperty 'spring.test.context.cache.maxSize', '16'
	// 캐시를 16개로 줄여도 테스트가 1700개를 넘으면서 Gradle 기본 heap 512MB로는
	// 컨텍스트 로딩 중 OutOfMemoryError(Java heap space)가 반복돼 늘린다.
	maxHeapSize = '1g'

	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
		showStandardStreams = false
	}
}

tasks.register('drawingMemoryTest', Test) {
	group = 'verification'
	description = '128MiB 힙에서 가중 추첨의 티켓 총합·후보 수별 스레드 할당량을 측정한다.'
	useJUnitPlatform {
		includeTags 'drawing-memory'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	minHeapSize = '128m'
	maxHeapSize = '128m'
	maxParallelForks = 1
	systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
	systemProperty 'drawing.memory.report', layout.buildDirectory.file('reports/drawing-memory/allocation.csv').get().asFile.absolutePath
	// 실행할 때마다 현재 JVM의 할당량과 메타데이터를 다시 기록한다.
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	testLogging {
		events 'passed', 'failed', 'standard_out'
		exceptionFormat 'full'
	}
}

tasks.register('loadTest', Test) {
	group = 'verification'
	description = 'NFR-06 응모 Lua 동시성 부하 테스트만 실행한다(TPS·p95·p99·오류율 로그 확인용).'
	useJUnitPlatform {
		includeTags 'load'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.config.additional-location', 'optional:classpath:/application-test.yml'
	testLogging {
		events "passed", "skipped", "failed", "standard_out"
		exceptionFormat "full"
	}
}

// 개발 전용 비교 코드와 운영 아티팩트를 분리한다. 외부 벤치마크 의존성은 추가하지 않는다.
sourceSets {
	benchmark {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	test {
		compileClasspath += sourceSets.benchmark.output
		runtimeClasspath += sourceSets.benchmark.output
	}
}

tasks.register('weightedRandomBenchmark', JavaExec) {
	group = 'verification'
	description = '개발 전용 가중치 비복원 추첨 비교. 일반 test/check에서는 실행하지 않는다.'
	classpath = sourceSets.benchmark.runtimeClasspath
	mainClass = 'kr.co.cking.drawing.domain.engine.WeightedRandomBenchmark'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	jvmArgs '-Xms512m', '-Xmx512m', '-XX:+UseG1GC'
	systemProperty 'benchmark.cpu', providers.gradleProperty('benchmarkCpu')
			.getOrElse(System.getenv('PROCESSOR_IDENTIFIER') ?: 'unknown')
	systemProperty 'benchmark.revision', providers.gradleProperty('benchmarkRevision').getOrElse('unrecorded')
	doFirst {
		def output = providers.gradleProperty('benchmarkOutput')
				.getOrElse(layout.buildDirectory.dir('weighted-random-' + System.currentTimeMillis()).get().asFile.path)
		file(output).absoluteFile.parentFile.mkdirs()
		args output,
				providers.gradleProperty('benchmarkWarmups').getOrElse('5'),
				providers.gradleProperty('benchmarkIterations').getOrElse('20'),
				providers.gradleProperty('benchmarkSeed').getOrElse('0123456789abcdef'.repeat(4)),
				providers.gradleProperty('benchmarkMaxTickets').getOrElse('1000000'),
				providers.gradleProperty('benchmarkMaxTicketBytes').getOrElse('8388608')
	}
}
