plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.cking'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 운영 패키지에 포함하지 않는 순수 엔진 확률 검증 도구. DB/Redis가 필요하지 않다.
sourceSets {
	simulation {
		compileClasspath = sourceSets.main.output
		runtimeClasspath = output + compileClasspath
	}
	test {
		compileClasspath += sourceSets.simulation.output
		runtimeClasspath += sourceSets.simulation.output
	}
}

tasks.register('weightedDistributionSimulation', JavaExec) {
	group = 'verification'
	description = '고정 기준으로 WEIGHTED_V1 대량 확률 분포를 검증하고 CSV와 실행 환경을 저장한다.'
	classpath = sourceSets.simulation.runtimeClasspath
	mainClass = 'kr.co.cking.drawing.simulation.WeightedDistributionSimulation'
	maxHeapSize = '1g'
	args layout.buildDirectory.dir('reports/weighted-distribution').get().asFile.absolutePath
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation platform('software.amazon.awssdk:bom:2.55.7')
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'com.adobe.testing:s3mock-testcontainers:5.2.3'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		// 부하 테스트(NFR-06)는 수백 건 동시 요청 + Consumer Drain 대기가 있어 매 빌드마다
		// 돌리지 않는다. 별도로 필요할 때 ./gradlew loadTest로 실행한다.
		excludeTags 'load'
	}
	// 테스트 프로필 설정을 모든 테스트 컨텍스트에 추가해 Hikari 연결 수를 제한한다.
	systemProperty 'spring.config.additional-location', 'optional:classpath:/application-test.yml'
	// 다양한 WebMvcTest 컨텍스트가 CI JVM 힙을 모두 점유하지 않도록 캐시 개수를 제한한다.
	systemProperty 'spring.test.context.cache.maxSize', '16'
	// 캐시를 16개로 줄여도 테스트가 1700개를 넘으면서 Gradle 기본 heap 512MB로는
	// 컨텍스트 로딩 중 OutOfMemoryError(Java heap space)가 반복돼 늘린다.
	maxHeapSize = '1g'

	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
		showStandardStreams = false
	}
}

tasks.register('loadTest', Test) {
	group = 'verification'
	description = 'NFR-06 응모 Lua 동시성 부하 테스트만 실행한다(TPS·p95·p99·오류율 로그 확인용).'
	useJUnitPlatform {
		includeTags 'load'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'spring.config.additional-location', 'optional:classpath:/application-test.yml'
	testLogging {
		events "passed", "skipped", "failed", "standard_out"
		exceptionFormat "full"
	}
}
