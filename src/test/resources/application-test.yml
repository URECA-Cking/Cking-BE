spring:
  datasource:
    hikari:
      # 다수의 Spring 테스트 컨텍스트가 동시에 생성해도 MySQL 연결 한도를 넘지 않도록 제한한다.
      maximum-pool-size: 3

cking:
  auth:
    # 테스트는 HTTP 환경을 가정하므로 Secure Cookie를 사용하지 않는다.
    refresh-cookie-secure: false
    jwt:
      # 테스트 전용 키이며 런타임 환경변수로 사용하지 않는다.
      secret: 2YNYNyIIJTSCD8zOXH/RpPp/Nm5+/n9gyVQpF5uRXlA=
  storage:
    # CI에는 S3Mock이 없어 메모리 구현을 쓴다. S3 구현은 S3ObjectStorageTest가 Testcontainers로 검증한다.
    type: memory
  # 스케줄러 자동 실행은 끈다. 테스트 컨텍스트는 캐시에 남아 다른 테스트가 도는 동안에도 그 스케줄러가 같은 DB·Redis를
  # 바꾼다. 스케줄러 동작을 확인하는 테스트는 스케줄러 메서드를 직접 호출한다.
  scheduling:
    enabled: false
