spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cking?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: cking
    password: cking

  data:
    redis:
      host: localhost
      port: 6379

cking:
  cors:
    allowed-origins: http://localhost:5173
    allow-credentials: true
  auth:
    frontend-callback-url: http://localhost:5173/oauth/callback
    jwt:
      secret: ${JWT_SECRET}
