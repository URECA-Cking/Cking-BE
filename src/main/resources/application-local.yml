spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cking?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: cking
    password: cking

  data:
    redis:
      host: localhost
      port: 6379

cking:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
    allow-credentials: true
  auth:
    refresh:
      user-allowed-origins: http://localhost:5173
      admin-allowed-origins: http://localhost:5174
    frontend-callback-url: http://localhost:5173/oauth/callback
    refresh-cookie-secure: false
    jwt:
      secret: ${JWT_SECRET}
    admin-seed:
      # 평문 비밀번호는 로컬 환경변수에서만 받고, 명시적으로 켠 경우에만 초기화한다.
      enabled: ${ADMIN_ACCOUNT_SEED_ENABLED:false}
      login-id: ${ADMIN_ACCOUNT_LOGIN_ID:admin}
      password: ${ADMIN_ACCOUNT_PASSWORD:}
  storage:
    type: s3
    bucket: cking-local-uploads
    region: ap-northeast-2
    endpoint: http://localhost:9090
