spring:
  datasource:
    # 암호에는 기본값을 두지 않는다. 주입되지 않으면 잘못된 값으로 기동하는 대신 실패해야 한다.
    url: jdbc:mysql://${DB_HOST}:3306/cking?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      # compose 안에서는 서비스명이 곧 호스트명이다.
      host: ${REDIS_HOST:redis}
      port: 6379

server:
  # ALB가 HTTPS를 종료하고 앱에는 HTTP로 전달한다. X-Forwarded-* 헤더를 신뢰해야
  # 앱이 만드는 URL(Swagger 서버 주소, 리다이렉트 등)이 https로 나온다.
  # 8080은 ALB 보안 그룹에서만 열려 있어 헤더를 위조해 보낼 수 없다.
  forward-headers-strategy: framework

cking:
  cors:
    allowed-origins: https://dev.cking.co.kr
    allow-credentials: true
  docs:
    # 개발 서버는 인터넷에 공개되어 있다. 값이 주입되지 않으면 문서가 무방비로 열리는 대신 기동에 실패한다.
    username: ${DOCS_USERNAME}
    password: ${DOCS_PASSWORD}
  auth:
    frontend-callback-url: https://dev.cking.co.kr/oauth/callback
    jwt:
      secret: ${JWT_SECRET}
    refresh-cookie-secure: true
