spring:
  application:
    name: cking-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 미설정이면 JVM 기본 타임존을 쓴다. 팀원 로컬은 KST, CI는 UTC라 환경마다 값이 달라진다.
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

cking:
  snapshot:
    recovery:
      interval-ms: 60000
      grace-period: PT1M
      batch-size: 100
  cors:
    # 비우면 교차 출처 요청을 허용하지 않는다. 로컬은 Vite 프록시로 같은 출처 요청이 된다.
    allowed-origins: ""
    # Cookie 기반 인증을 사용하는 환경에서는 허용 origin을 명시하고 true로 설정한다.
    allow-credentials: false
  docs:
    # 둘 중 하나라도 비우면 Swagger Basic Auth를 적용하지 않는다.
    username: ""
    password: ""
  auth:
    # 운영은 FRONTEND_CALLBACK_URL을 반드시 주입한다. 프로필별 기본값은 application-<profile>.yml에 둔다.
    frontend-callback-url: ${FRONTEND_CALLBACK_URL}
    jwt:
      # 개발·운영에서는 저장소 밖의 256비트 이상 Base64 비밀값을 주입한다.
      secret: ${JWT_SECRET}
      issuer: cking
      access-token-ttl: PT30M
    refresh-token-ttl: P14D
    # 운영 HTTPS 환경은 반드시 REFRESH_COOKIE_SECURE=true를 명시적으로 주입한다.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE}
