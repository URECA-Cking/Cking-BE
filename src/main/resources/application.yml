spring:
  application:
    name: cking-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 미설정이면 JVM 기본 타임존을 쓴다. 팀원 로컬은 KST, CI는 UTC라 환경마다 값이 달라진다.
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

cking:
  snapshot:
    recovery:
      interval-ms: 60000
      grace-period: PT1M
      batch-size: 100
  cors:
    # 비우면 교차 출처 요청을 허용하지 않는다. 로컬은 Vite 프록시로 같은 출처 요청이 된다.
    allowed-origins: ""
    # Refresh Cookie를 사용하는 인증 전환 전까지 credential을 허용하지 않는다.
    allow-credentials: false
  docs:
    # 둘 중 하나라도 비우면 Swagger Basic Auth를 적용하지 않는다.
    username: ""
    password: ""
  auth:
    # 운영은 FRONTEND_CALLBACK_URL을 반드시 주입한다. 프로필별 기본값은 application-<profile>.yml에 둔다.
    frontend-callback-url: ${FRONTEND_CALLBACK_URL}
    jwt:
      issuer: cking
      access-token-ttl: PT30M
