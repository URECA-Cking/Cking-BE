spring:
  application:
    name: cking-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 미설정이면 JVM 기본 타임존을 쓴다. 팀원 로컬은 KST, CI는 UTC라 환경마다 값이 달라진다.
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      # 구독 인증 이미지 계약은 파일 5MB까지 허용한다. 요청 전체에는 multipart overhead 여유를 둔다.
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

cking:
  image-processing:
    # 20MP 한 장이 heap 약 80MiB를 쓰고, 동시 4장부터 GCLocker로 OutOfMemoryError가 났다(로컬 측정). CPU 2개라 처리량도 2에서 멈춘다.
    max-concurrent: 2
    # 처리를 기다리는 요청 수. 원본(최대 5MB)을 heap에 올린 요청을 처리 중 + 대기 중으로 묶는다.
    max-waiting: 4
    # 임시값. 개발 서버에서 처리 시간을 확인한 뒤 확정한다.
    acquire-timeout: 3s
  verification:
    youtube-subscription:
      # VLM Processor와 Recovery가 준비될 때까지 신규 제출은 닫는다.
      submission-enabled: false
      processing-executor:
        # Provider 계정 한도에 맞춘 인스턴스별 동시 호출 수이며 max-pool-size와 같아야 한다.
        core-pool-size: ${SUBSCRIPTION_VERIFICATION_EXECUTOR_CORE_POOL_SIZE:2}
        max-pool-size: ${SUBSCRIPTION_VERIFICATION_EXECUTOR_MAX_POOL_SIZE:2}
        # 무제한 queue를 금지하고, 포화 거절 작업은 PENDING으로 남겨 Recovery가 다시 제출한다.
        queue-capacity: ${SUBSCRIPTION_VERIFICATION_EXECUTOR_QUEUE_CAPACITY:20}
        provider-max-concurrent-calls: ${SUBSCRIPTION_VERIFICATION_PROVIDER_MAX_CONCURRENT_CALLS:2}
        # connect/read timeout과 Provider 내부 재시도·backoff보다 길게 설정한다.
        processing-lease-duration: ${SUBSCRIPTION_VERIFICATION_PROCESSING_LEASE_DURATION:PT90S}
        await-termination-seconds: ${SUBSCRIPTION_VERIFICATION_EXECUTOR_AWAIT_TERMINATION_SECONDS:30}
      recovery:
        enabled: ${SUBSCRIPTION_VERIFICATION_RECOVERY_ENABLED:true}
        interval-ms: ${SUBSCRIPTION_VERIFICATION_RECOVERY_INTERVAL_MS:60000}
        pending-grace-period: ${SUBSCRIPTION_VERIFICATION_RECOVERY_PENDING_GRACE_PERIOD:PT1M}
        # 기본 Executor의 max pool 2 + queue 20을 넘지 않도록 제한한다.
        batch-size: ${SUBSCRIPTION_VERIFICATION_RECOVERY_BATCH_SIZE:20}
        max-processing-attempts: ${SUBSCRIPTION_VERIFICATION_MAX_PROCESSING_ATTEMPTS:3}
        reward-backoff-base: ${SUBSCRIPTION_VERIFICATION_REWARD_BACKOFF_BASE:PT1M}
        reward-backoff-max: ${SUBSCRIPTION_VERIFICATION_REWARD_BACKOFF_MAX:PT1H}
      deepseek:
        # API 키는 배포 환경의 DEEPSEEK_API_KEY Secret으로만 주입한다.
        api-key: ${DEEPSEEK_API_KEY:}
        model: ${DEEPSEEK_MODEL:deepseek-flash}
        endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com/chat/completions}
        connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:PT2S}
        read-timeout: ${DEEPSEEK_READ_TIMEOUT:PT30S}
        max-attempts: ${DEEPSEEK_MAX_ATTEMPTS:2}
        retry-backoff: ${DEEPSEEK_RETRY_BACKOFF:PT1S}
        max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:512}
  quiz:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${GEMINI_READ_TIMEOUT:PT30S}
      max-attempts: ${GEMINI_MAX_ATTEMPTS:2}
  snapshot:
    recovery:
      interval-ms: 60000
      grace-period: PT1M
      batch-size: 100
  cors:
    # 비우면 교차 출처 요청을 허용하지 않는다. 로컬은 Vite 프록시로 같은 출처 요청이 된다.
    allowed-origins: ""
    # Cookie 기반 인증을 사용하는 환경에서는 허용 origin을 명시하고 true로 설정한다.
    allow-credentials: false
  docs:
    # 둘 중 하나라도 비우면 Swagger Basic Auth를 적용하지 않는다.
    username: ""
    password: ""
  auth:
    # 운영은 FRONTEND_CALLBACK_URL을 반드시 주입한다. 프로필별 기본값은 application-<profile>.yml에 둔다.
    frontend-callback-url: ${FRONTEND_CALLBACK_URL}
    jwt:
      # 개발·운영에서는 저장소 밖의 256비트 이상 Base64 비밀값을 주입한다.
      secret: ${JWT_SECRET}
      issuer: cking
      access-token-ttl: PT30M
    refresh-token-ttl: P14D
    # 운영 HTTPS 환경은 반드시 REFRESH_COOKIE_SECURE=true를 명시적으로 주입한다.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE}
