spring:
  application:
    name: cking-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 미설정이면 JVM 기본 타임존을 쓴다. 팀원 로컬은 KST, CI는 UTC라 환경마다 값이 달라진다.
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

cking:
  snapshot:
    recovery:
      interval-ms: 60000
      grace-period: PT1M
      batch-size: 100
  cors:
    # 비우면 교차 출처 요청을 허용하지 않는다. 로컬은 Vite 프록시로 같은 출처 요청이 된다.
    allowed-origins: ""
    # Refresh Cookie를 사용하는 인증 전환 전까지 credential을 허용하지 않는다.
    allow-credentials: false
  docs:
    # 비우면 API 문서 인증 필터를 등록하지 않는다.
    username: ""
    password: ""
