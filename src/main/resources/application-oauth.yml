spring:
  config:
    activate:
      on-profile: oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            scope: profile, email
          kakao:
            provider: kakao
            client-id: ${OAUTH_KAKAO_CLIENT_ID}
            client-secret: ${OAUTH_KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cking:
  youtube-oauth:
    # 로그인용 Google Client와 분리한다. 값이 없으면 채널 연결을 시작할 수 없다.
    client-id: ${OAUTH_YOUTUBE_CLIENT_ID:}
    client-secret: ${OAUTH_YOUTUBE_CLIENT_SECRET:}
    # 검증 후 핸들이 다른 채널에 재할당됐는지 판정 직전에 확인한다.
    api-key: ${OAUTH_YOUTUBE_API_KEY:}
    connect-timeout: ${OAUTH_YOUTUBE_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${OAUTH_YOUTUBE_READ_TIMEOUT:PT10S}
