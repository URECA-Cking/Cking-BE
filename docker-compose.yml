services:
  mysql:
    image: mysql:8.4
    container_name: cking-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cking
      MYSQL_USER: cking
      MYSQL_PASSWORD: cking
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: cking-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
