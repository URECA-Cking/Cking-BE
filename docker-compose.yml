services:
  mysql:
    # 개발 RDS와 같은 8.4 LTS 계열을 쓴다.
    image: mysql:8.4.9@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
    container_name: cking-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cking
      MYSQL_USER: cking
      MYSQL_PASSWORD: cking
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 업무 시각은 UTC로 저장한다. 이미지·RDS 기본값이 UTC이지만 바뀌어도 흔들리지 않게 못 박는다.
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.2.16-alpine@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
    container_name: cking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    container_name: cking-s3mock
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cking-local-uploads
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-2
      # 이미지가 실행 사용자(cnb) 소유로 만들어 둔 경로다. 새 볼륨이 이 소유권을 이어받아야 쓰기가 된다.
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3mock-data:/s3mockroot

volumes:
  mysql-data:
  s3mock-data:
