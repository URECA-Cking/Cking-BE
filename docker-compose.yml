services:
  mysql:
    # 개발 RDS와 같은 8.4 LTS 계열을 쓴다.
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: cking-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cking
      MYSQL_USER: cking
      MYSQL_PASSWORD: cking
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 업무 시각은 UTC로 저장한다. 이미지·RDS 기본값이 UTC이지만 바뀌어도 흔들리지 않게 못 박는다.
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # localhost는 소켓으로 붙어 초기화용 임시 서버에도 통과한다. TCP로 붙어야 진짜 서버가 뜬 뒤에만 통과한다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.2.16-alpine@sha256:ee061d86c25773048211e99f00d63b47b9ecfe28560113e16cce2c962d5bec1c
    container_name: cking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    container_name: cking-s3mock
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cking-local-uploads
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ap-northeast-2
      # 이미지가 실행 사용자(cnb) 소유로 만들어 둔 경로다. 새 볼륨이 이 소유권을 이어받아야 쓰기가 된다.
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3mock-data:/s3mockroot

volumes:
  mysql-data:
  s3mock-data:
