# 개발 서버(EC2)용. DB는 RDS를 사용하므로 mysql 서비스를 두지 않는다.
# 환경변수는 deploy/deploy.sh가 Parameter Store에서 읽어 넘긴다. 서버에 .env를 두지 않는다.

services:
  redis:
    image: redis:7.2.16-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    container_name: cking-redis
    restart: unless-stopped
    # maxmemory: 인프라 명세 3.4의 초기 배분값. noeviction은 한도가 있어야 동작한다.
    # noeviction: 응모권 잔액 키가 축출되면 명세 2.4의 BALANCE_NOT_LOADED 복구가 상시 유발된다.
    # appendonly: 컨테이너 재시작 시 잔액을 잃지 않도록 AOF를 사용한다.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        # 수집기가 로그를 서비스별로 나누도록 서비스 이름을 로그 줄에 함께 기록한다.
        labels: "com.docker.compose.service"

  app:
    # 태그는 배포 시점에 deploy.sh가 지정한다. latest는 동시 빌드 시 과거 이미지로 덮어써질 수 있다.
    image: ghcr.io/ureca-cking/cking-be:${IMAGE_TAG:?배포 태그가 지정되지 않았습니다}
    container_name: cking-app
    restart: unless-stopped
    # 종료 신호 뒤 앱이 웹 요청(최대 30초)과 작업 큐(최대 30초)를 차례로 마무리할 시간. 기본 10초면 중간에 끊긴다.
    stop_grace_period: 90s
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev,oauth
      DB_HOST: ${DB_HOST:?DB_HOST가 지정되지 않았습니다}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME이 지정되지 않았습니다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 지정되지 않았습니다}
      DOCS_USERNAME: ${DOCS_USERNAME:?DOCS_USERNAME이 지정되지 않았습니다}
      DOCS_PASSWORD: ${DOCS_PASSWORD:?DOCS_PASSWORD가 지정되지 않았습니다}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET이 지정되지 않았습니다}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:?OAUTH_GOOGLE_CLIENT_ID가 지정되지 않았습니다}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:?OAUTH_GOOGLE_CLIENT_SECRET이 지정되지 않았습니다}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:?OAUTH_KAKAO_CLIENT_ID가 지정되지 않았습니다}
      OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:?OAUTH_KAKAO_CLIENT_SECRET이 지정되지 않았습니다}
      SUBSCRIPTION_GEMINI_API_KEY: ${SUBSCRIPTION_GEMINI_API_KEY:?SUBSCRIPTION_GEMINI_API_KEY가 지정되지 않았습니다}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY가 지정되지 않았습니다}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY가 지정되지 않았습니다}
      ADMIN_ACCOUNT_LOGIN_ID: ${ADMIN_ACCOUNT_LOGIN_ID:?ADMIN_ACCOUNT_LOGIN_ID가 지정되지 않았습니다}
      ADMIN_ACCOUNT_PASSWORD: ${ADMIN_ACCOUNT_PASSWORD:?ADMIN_ACCOUNT_PASSWORD가 지정되지 않았습니다}
      IMAGE_TAG: ${IMAGE_TAG}
      CKING_CONSUMER_ID: ${CKING_CONSUMER_ID:-}
      # 필터는 application-dev.yml에서 켠다. 아래 값은 deploy.sh가 넘길 때만 전달한다(개발은 주소, 부하 테스트는 끄기).
      COMMENT_FILTER_ENABLED:
      COMMENT_FILTER_BASE_URL:
      REDIS_HOST: redis
      # 상한을 걸면 JVM이 힙(상한의 25%)과 GC를 다시 고르므로 상한 전 값(힙 460MiB, G1)을 고정한다.
      JDK_JAVA_OPTIONS: "-Xmx460m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    # memswap_limit을 mem_limit과 같게 두어 컨테이너가 swap을 쓰지 않게 한다.
    mem_limit: 1000m
    memswap_limit: 1000m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "com.docker.compose.service"

volumes:
  redis-data:
